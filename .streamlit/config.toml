[server]
# serves files in static/ at app/static/... so source links can open the PDFs
enableStaticServing = true

[theme]
# soft pastel pregnancy theme: rose, peach and cream
base = "light"
primaryColor = "#c9557a"
backgroundColor = "#fff8f3"
secondaryBackgroundColor = "#fde8e4"
textColor = "#4a3a3f"
font = "sans serif"
